version = 1

[[suites]]
name = "sdk"
command = ["pytest-3", "tests/test_sdk.py", "tests/test_sdk_packaging.py", "tests/test_apsl_texts.py"]
needs = "host"
timeout = 120

[[suites]]
name = "build-tree"
command = ["pytest-3", "tests/test_build_tree.py", "tests/test_libnotify.py"]
needs = "host"
timeout = 120
description = "Build paths, source preservation, cleanup and stable compiler output."

[[suites]]
name = "libxpc"
command = ["pytest-3", "tests/test_libxpc.py"]
needs = "host"
timeout = 300
description = "Host stubs, including address and undefined behaviour sanitizers."
