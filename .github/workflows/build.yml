name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git-buildpackage dpkg-dev build-essential
          sudo DEBIAN_FRONTEND=noninteractive apt-get build-dep -y --no-install-recommends ./

      - name: Check tag matches debian/changelog
        if: github.ref_type == 'tag'
        run: |
          version=$(dpkg-parsechangelog -SVersion)
          if [ "$GITHUB_REF_NAME" != "${version%-*}" ]; then
            echo "tag $GITHUB_REF_NAME is not ${version%-*}, debian/changelog's upstream version" >&2
            exit 1
          fi

      - name: Package
        run: |
          gbp buildpackage --git-ignore-branch --git-debian-branch=HEAD --git-export-dir="$RUNNER_TEMP/build-area" \
            --git-builder="dpkg-buildpackage -us -uc -j$(nproc)"
          mkdir -p dist
          cp "$RUNNER_TEMP"/build-area/pietoolchain* dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pietoolchain
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pietoolchain
          path: dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  release:
    needs: attest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pietoolchain
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" dist/*
          fi
